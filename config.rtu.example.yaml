http_address: "127.0.0.1:8080"
queue_path: "data/queue.db"
queue_max_bytes: 1073741824

connections:
  - id: rs485-bus-1
    transport: rtu
    serial_port: "/dev/ttyUSB0" # Windows: COM3. Prefer /dev/serial/by-id/... on Linux.
    baud: 19200
    parity: E
    stop_bits: 1
    timeout: 2s
    retries: 1

meters:
  - id: pm5110-01
    name: "Panel Utama"
    location: "Ruang Panel"
    connection: rs485-bus-1
    unit_id: 1
    interval: 10s
    energy: true
