services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 2s
      retries: 15
  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://test:test@db:5432/test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "go test -race ./... && go vet ./..."]
